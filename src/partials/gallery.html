<section id="gallery" class="gallery-section">
  <div class="container">
    
    <h2 class="gallery-title">Gallery</h2>

    <div class="slider-container">
      <div class="slider-track">
        <div class="slide">
          <img src="../img/gallery_section/Gallery_Image_one.png" alt="Location 1">
        </div>
        <div class="slide">
          <img src="../img/gallery_section/Gallery_Image_two.png" alt="Location 2">
        </div>
        <div class="slide">
          <img src="../img/gallery_section/Gallery_Image_three.png" alt="Location 3">
        </div>
        <div class="slide">
          <img src="../img/gallery_section/Gallery_Image_four.png" alt="Location 4">
        </div>
        <div class="slide">
          <img src="../img/gallery_section/Gallery_Image_five.png" alt="Location 5">
        </div>
        </div>

        <button class="slider-btn prev" aria-label="Previous slide">❮</button>
      <button class="slider-btn next" aria-label="Next slide">❯</button>
      
      <div class="slider-pagination"></div>
    </div>

  </div>
</section>
