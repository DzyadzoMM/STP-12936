<section id="gallery" class="gallery-section">
  <div class="container">
    
    <h2 class="gallery-title">Gallery</h2>

    <div class="slider-container swiper" data-my-slider>
      <div class="slider-track swiper-wrapper">
        <div class="slide swiper-slide"><img src="./img/gallery_section/Gallery_Image_one.png" alt="1"></div>
        <div class="slide swiper-slide"><img src="./img/gallery_section/Gallery_Image_two.png" alt="2"></div>
        <div class="slide swiper-slide"><img src="./img/gallery_section/Gallery_Image_three.png" alt="3"></div>
        <div class="slide swiper-slide"><img src="./img/gallery_section/Gallery_Image_four.png" alt="4"></div>
        <div class="slide swiper-slide"><img src="./img/gallery_section/Gallery_Image_five.png" alt="5"></div>
        <div class="slide swiper-slide"><img src="./img/gallery_section/Gallery_Image_six.png" alt="6"></div>
      </div>

      <button class="slider-btn prev" data-slider-btn="prev" aria-label="Previous slide">❮</button>
      <button class="slider-btn next" data-slider-btn="next" aria-label="Next slide">❯</button>
      
      <div class="slider-pagination swiper-pagination" data-slider-pagination></div>
    </div>

  </div>
</section>
